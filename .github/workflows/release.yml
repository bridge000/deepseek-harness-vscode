name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Rename VSIX
        run: mv deepseek-harness.vsix "deepseek-harness-${GITHUB_REF_NAME}.vsix"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: deepseek-harness-*.vsix
          generate_release_notes: true
