name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package VSIX
        if: matrix.node == 22
        run: npm run package
      - name: Upload VSIX
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-vsix
          path: deepseek-harness.vsix
          if-no-files-found: error
